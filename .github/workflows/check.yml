name: Quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare D drive workspace
        shell: pwsh
        run: |
          # WiX 3 的 .NET Framework 临时目录 ACL 调用使用 ANSI 路径；英文 runner
          # 无法编码中文 TEMP。CI 使用 D 盘 ASCII 工作区，保留系统安全检查。
          # 应用的中文路径支持另由 distribution 原生启动验收覆盖。
          $destination = 'D:\zhenjing-ci'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy $env:GITHUB_WORKSPACE $destination /E /XD .git /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'Workspace copy failed' }
          exit 0
      # bootstrap 最后会运行 env:check，.NET 必须先准备好；该脚本不依赖 Node/Rust。
      - name: Prepare portable .NET SDK
        shell: pwsh
        working-directory: D:\zhenjing-ci
        run: ./scripts/prepare-dotnet.ps1
      - name: Prepare isolated tools
        shell: pwsh
        working-directory: D:\zhenjing-ci
        run: |
          # 只读复用 runner 已有工具，不安装组件。SDK 的 Lib 目录还可能包含 wdf 等非版本目录。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Runner 未提供 C++ 工具链' }
          $vc = Get-ChildItem (Join-Path $installation 'VC\Tools\MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' -and (Test-Path (Join-Path $_.FullName 'bin\Hostx64\x64\link.exe')) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdk = Get-ChildItem (Join-Path $sdkRoot 'Lib') -Directory |
            Where-Object {
              $_.Name -match '^\d+(\.\d+)+$' -and
              (Test-Path (Join-Path $_.FullName 'um\x64\kernel32.lib')) -and
              (Test-Path (Join-Path $_.FullName 'ucrt\x64\ucrt.lib')) -and
              (Test-Path (Join-Path $sdkRoot ('Include\' + $_.Name + '\um\Windows.h')))
            } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $vc -or -not $sdk) { throw 'Runner 未提供完整的 MSVC/Windows SDK' }
          ./scripts/bootstrap.ps1 -MsvcSource $vc.FullName -SdkSource $sdkRoot -SdkVersion $sdk.Name
      - name: Quality checks
        shell: pwsh
        working-directory: D:\zhenjing-ci
        run: ./dev.ps1 check
      - name: Build desktop executable
        shell: pwsh
        working-directory: D:\zhenjing-ci
        # 公共质量任务只验证实际链接，不获取或生成用于公开分发的签名凭据。
        # 正式 MSI 打包在具有持久私钥和发布审批的环境执行。
        run: ./dev.ps1 tauri build --no-bundle
