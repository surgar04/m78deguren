[package]
name = "zhenjing"
version = "0.9.1"
description = "臻境桌面应用"
publish = false
rust-version = "1.96"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zhenjing_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "rt", "fs", "io-util", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.18.2"
rtrb = "0.3"
arc-swap = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ttf-parser = "0.25"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
semver = "1"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
roxmltree = "0.21"
rfd = { version = "=0.16.1", default-features = false }
tempfile = "=3.27.0"
# 仅启用进程信息；不采集 CPU/磁盘/网络计数，避免为加速准备重复启动硬件监测。
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
ferrisetw = "=1.2.0"
