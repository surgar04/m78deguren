<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>臻境 · 手机监控</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: linear-gradient(145deg, #d7ebe5, #eaf5ff);
      color: #193843;
      font:
        15px system-ui,
        sans-serif;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 22px;
    }
    h1 {
      font-size: 25px;
    }
    p {
      color: #56717d;
    }
    section {
      padding: 18px;
      background: #ffffffc9;
      border: 1px solid #fff;
      border-radius: 18px;
      margin: 12px 0;
      box-shadow: 0 4px 20px #3158470a;
    }
    dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
    }
    dd {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      margin: 0;
    }
    select {
      font: inherit;
      padding: 8px;
      border: 1px solid #bfded6;
      border-radius: 8px;
      background: #fff;
      max-width: 100%;
    }
    .note {
      font-size: 12px;
    }
  </style>
  <main>
    <h1>臻境 · 实时监控</h1>
    <p id="status" role="status">正在连接…</p>
    <section>
      <label
        >显卡
        <select id="gpu"></select
      ></label>
      <dl id="metrics"></dl>
    </section>
    <p class="note">
      仅显示电脑实际采集到的读数。未开启、样本不足或设备不支持的指标显示“—”。关闭电脑端远程监控后，本链接立即失效。
    </p>
  </main>
  <script src="/monitor.js"></script>
</html>
